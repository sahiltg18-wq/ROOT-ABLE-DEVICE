<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity X - Complete Device Downloads</title>
<style>
  :root{
    --bg:#0b0d12;
    --card:#141821;
    --card-border:#232838;
    --accent:#7c5cff;
    --accent2:#4dd0ff;
    --text:#e7e9ee;
    --muted:#8a90a2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:linear-gradient(180deg,#0e1118 90%,rgba(14,17,24,0));
    padding:22px 16px 14px;
    text-align:center;
    border-bottom:1px solid var(--card-border);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.6rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.85rem;
  }
  #search{
    width:min(480px,90%);
    margin:14px auto 0;
    display:block;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:#0f1219;
    color:var(--text);
    font-size:0.95rem;
  }
  #search:focus{outline:none;border-color:var(--accent);}
  #count{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin:10px 0 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
    padding:20px 16px 60px;
    max-width:1200px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
  }
  .thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:10px;
    background:linear-gradient(135deg,#1b1f2b,#242a3c);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.5rem;
  }
  .name{
    font-size:0.92rem;
    font-weight:600;
    line-height:1.25;
  }
  .badge{
    align-self:flex-start;
    font-size:0.65rem;
    color:var(--accent2);
    background:rgba(77,208,255,0.1);
    border:1px solid rgba(77,208,255,0.25);
    padding:2px 8px;
    border-radius:20px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    padding:20px 16px 40px;
    border-top:1px solid var(--card-border);
  }
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <h1>Infinity X — Complete Rootable Device</h1>
  <p>Full list of supported devices for Infinity X custom ROM</p>
  <input id="search" type="text" placeholder="Search by device name...">
  <div id="count"></div>
</header>

<main class="grid" id="grid"></main>

<footer>
  Complete device listing for Infinity X custom ROM.<br>
  For official builds, changelogs, and flash guides visit <strong>projectinfinity-x.com/downloads</strong>
</footer>

<script>
const devices = [
  "Samsung Galaxy A25 5G","Samsung Galaxy A33 5G",
  "Samsung Galaxy A52s 5G","Samsung Galaxy A53 5G",
  "Pixel 8a","POCO F3 / Redmi K40 / Mi 11X",
  "Nothing Phone 2a / 2a Pro","OnePlus 12R / Ace 3",
  "OnePlus Nord","Pixel 5a",
  "Redmi Note 8 Pro","POCO F1",
  "Samsung Galaxy S10e","Samsung Galaxy S10",
  "Samsung Galaxy S10+","Samsung Galaxy S10 5G",
  "Pixel 4a 5G","Pixel 9 Pro",
  "Motorola G54 / G64","Pixel 7 Pro",
  "POCO M3","OnePlus Ace 3 Pro",
  "Samsung Galaxy Note 10","Samsung Galaxy Note 10 5G",
  "Samsung Galaxy Note 10+","Samsung Galaxy Note 10+ 5G",
  "Xiaomi 12T Pro / Redmi K50 Ultra","OnePlus 13 5G",
  "Motorola Edge 30","Samsung Galaxy F42",
  "Motorola G34 / G45","Redmi Note 13 Pro 5G / POCO X6 5G",
  "Xiaomi Mi 5","Redmi Note 8 / 8T",
  "OnePlus 13R 5G","OnePlus Ace 5 Pro",
  "OnePlus 7","Mi 11X Pro / Mi 11i / Redmi K40 Pro+",
  "OnePlus 7T","Pixel 8 Pro",
  "Realme 9 SE 5G","POCO X3 Pro 5G",
  "Pixel 9 Pro XL","POCO Ace 8",
  "Xiaomi Redmi 9","Redmi Note 7",
  "OnePlus 9","OnePlus 9 Pro",
  "OnePlus 9R","Tecno Pova 5",
  "Redmi K70 / K70 NFC / Redmi Note 14 4G","Pixel 7a",
  "Samsung Galaxy M30s","Samsung Galaxy M33 5G",
  "Redmi Note 9","Samsung Galaxy M13",
  "Samsung Galaxy M24 5G","Samsung Galaxy M62 5G",
  "POCO F5 / Redmi Note 13 Turbo","Xiaomi Redmi 9",
  "Samsung Galaxy M34 5G","Samsung Galaxy M52 5G",
  "POCO F5 / Redmi Note 12 Turbo","Xiaomi Redmi Note 9",
  "Redmi Note 9S / Pro / Pro Max & POCO M2 Pro","Redmi Note 10",
  "POCO F5 Pro / Redmi K60","POCO F4",
  "POCO F7 / Redmi Turbo 4 Pro","Pixel 6",
  "Pixel 7","POCO F6",
  "Xiaomi Pad 6","Nothing Phone 2",
  "Mi 9T Pro / Redmi K20 Pro","Pixel 6 Pro",
  "Pixel 5","POCO X5 Pro 5G",

  "Redmi Note 12 Pro / Pro+ 5G / Discovery Edition","Itel RS4",

  "Redmi Note 10 Pro / Pro Max","Pixel 9a",

  "POCO X3 Pro","POCO F6 Pro / Redmi K70",
  "Redmi Note 11 Pro Plus 5G / POCO X4 Pro 5G","Xiaomi 11T Pro",
  "Redmi Note 7 Pro","Redmi Note 5 Pro",
  "Infinix Note 30 Pro","Infinix Note 30"
];

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

function render(list){
  grid.innerHTML = '';
  list.forEach(name => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">📱</div>
      <div class="badge">Supported</div>
      <div class="name">${name}</div>
    `;
    grid.appendChild(card);
  });
  countEl.textContent = `${list.length} device(s) supported`;
}

render(devices);

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = devices.filter(d => d.toLowerCase().includes(q));
  render(filtered);
});
</script>

</body>
</html>
