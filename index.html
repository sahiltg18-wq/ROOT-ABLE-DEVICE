<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity X - Device Downloads</title>
<style>
  :root{
    --bg:#0b0d12;
    --card:#141821;
    --card-border:#232838;
    --accent:#7c5cff;
    --accent2:#4dd0ff;
    --text:#e7e9ee;
    --muted:#8a90a2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:linear-gradient(180deg,#0e1118 90%,rgba(14,17,24,0));
    padding:22px 16px 14px;
    text-align:center;
    border-bottom:1px solid var(--card-border);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.6rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.85rem;
  }
  #search{
    width:min(480px,90%);
    margin:14px auto 0;
    display:block;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:#0f1219;
    color:var(--text);
    font-size:0.95rem;
  }
  #search:focus{outline:none;border-color:var(--accent);}
  #count{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin:10px 0 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px;
    padding:20px 16px 60px;
    max-width:1200px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .15s ease, border-color .15s ease;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
  }
  .thumb{
    width:100%;
    aspect-ratio:4/5;
    border-radius:10px;
    background:#1b1f2b;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .name{
    font-size:0.92rem;
    font-weight:600;
    line-height:1.25;
    min-height:2.2em;
  }
  .code{
    font-size:0.75rem;
    color:var(--accent2);
    font-family:monospace;
  }
  .badge{
    align-self:flex-start;
    font-size:0.65rem;
    color:var(--accent2);
    background:rgba(77,208,255,0.1);
    border:1px solid rgba(77,208,255,0.25);
    padding:2px 8px;
    border-radius:20px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    padding:20px 16px 40px;
    border-top:1px solid var(--card-border);
  }
  .hidden{display:none !important;}
</style>
</head>

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

function render(list){
  grid.innerHTML = '';
  list.forEach(device => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><img src="${device.image}" alt="${device.name}" loading="lazy"></div>
      <div class="badge">Supported</div>
      <div class="name">${device.name}</div>
      <div class="code">${device.code}</div>
    `;
    grid.appendChild(card);
  });
  countEl.textContent = `${list.length} device(s) supported`;
}

render(allDevices);

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = allDevices.filter(d => 
    d.name.toLowerCase().includes(q) || 
    d.code.toLowerCase().includes(q)
  );
  render(filtered);
});
</script>
